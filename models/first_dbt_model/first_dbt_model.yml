version: 2

models:
  - name: employee #model name
    description: "Employee DBT model"
    columns: 
    # name of the columns and what test need to be run on them. 
      - name: emp_id #column name
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5']
                config: 
                  severity: warn
      - name: emp_salary #column name
        data_tests:
          - salary_check
  - name: customers #model name
    description: "Costomers DBT model"
    columns:
      - name: country
  - name: sales
    description: "Sales DBT model"
  - name: product
    description: "Product DBT model"
sources:
  - name: employee #source name to be referenced in dbt
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customers_src
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: customers
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMERS
  - name: sales_src
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product_src
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC